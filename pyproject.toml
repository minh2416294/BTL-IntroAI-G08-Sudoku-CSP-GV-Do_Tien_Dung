[project]
name = "sudoku-csp"
version = "0.1.0"
description = "Giải, sinh và minh họa Sudoku bằng các kỹ thuật thỏa mãn ràng buộc (CSP). BTL IT3160, nhóm 8."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.9",
    "pandas>=2.2",
]
dev = [
    "httpx>=0.27",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sudoku_csp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["sudoku_csp", "app", "experiments", "tests"]

[tool.pyright]
include = ["sudoku_csp", "app", "experiments", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
